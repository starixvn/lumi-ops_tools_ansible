
backend l1_gamelobby_simulator_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /main/(.*) /\1
    server-template l1_gamelobby_simulator 1 l1-gamelobby-simulator-LOCAL:8106 check resolvers docker init-addr libc,none

backend l1_gamelobby_simulator1_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    acl existing-x-forwarded-host req.hdr(X-Forwarded-Host) -m found
    http-request add-header X-Forwarded-Host %[req.hdr(Host)]/v1 unless existing-x-forwarded-host    
    reqrep ^([^\ :])\ /v1/(.) \1\ /\2
    server-template l1_gamelobby_simulator1 1 l1-gamelobby-simulator-LOCAL-1:5000 check resolvers docker init-addr libc,none

backend l1_owapi_simulator_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /healthcheck
    http-check expect status 200
    cookie serverid insert
    server-template l1_owapi_simulator 1 l1-ow-api-simulator-LOCAL:8105 check resolvers docker init-addr libc,none
    