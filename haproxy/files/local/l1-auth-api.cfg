
backend l1_auth_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_auth_api 1 l1-auth-api-LOCAL:8101 check resolvers docker init-addr libc,none
    
backend l1_auth_api1_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_auth_api_1 1 l1-auth-api-LOCAL-1:5000 check resolvers docker init-addr libc,none