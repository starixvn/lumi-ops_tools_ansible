
backend l2_game_admin_site_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l2-game-admin-site 1 l2-game-admin-site-LOCAL:9102 check resolvers docker init-addr libc,none

backend l2_game_admin_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2-game-admin-api 1 l2-game-admin-api-LOCAL:9103 check resolvers docker init-addr libc,none
    