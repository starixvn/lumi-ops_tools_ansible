
backend l1_game_client_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_client 1 l1-game-client-LOCAL:80 check resolvers docker init-addr libc,none

