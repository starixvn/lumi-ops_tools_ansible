
backend l1_game_admin_site_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l1-game-admin-site 1 l1-game-admin-site-LOCAL:8102 check resolvers docker init-addr libc,none

backend l1_game_admin_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1-game-admin-api 1 l1-game-admin-api-LOCAL:8103 check resolvers docker init-addr libc,none
    