
backend l1_game_round_result_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l1_result_page 1 l1-game-round-result-LOCAL:8104 check resolvers docker init-addr libc,none

backend l1_game_round_result1_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l1_result_page_1 1 l1-game-round-result-LOCAL-1:5000 check resolvers docker init-addr libc,none
    