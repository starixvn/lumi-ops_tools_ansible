
backend l1_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_api 2 l1-api-LOCAL:8100 check resolvers docker init-addr libc,none

backend l1_api1_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /v1/(.*) /\1
    server-template l1_api_1 2 l1-api-LOCAL-1:5000 check resolvers docker init-addr libc,none