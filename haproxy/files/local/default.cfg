global
    maxconn 50000
    log fd@2 local2
    chroot       /var/lib/haproxy
    pidfile      /var/run/haproxy.pid
    user         haproxy
    group        haproxy
    stats socket /var/lib/haproxy/stats expose-fd listeners
    master-worker

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold other      10s
    hold refused    10s
    hold nx         10s
    hold timeout    10s
    hold valid      10s
    hold obsolete   10s


defaults
    mode http
    log global
    option httplog
    option  http-server-close
    option  dontlognull
    option  redispatch
    option  contstats
    retries 5
    backlog 10000
    maxconn 50000
    timeout connect 10s
    timeout client 30s
    timeout server 30s
    timeout tunnel        3600s
    timeout http-keep-alive  1s
    timeout http-request    15s
    timeout queue           30s
    timeout tarpit          60s
    default-server inter 3s rise 2 fall 3

frontend http_in
    bind *:80
    mode  http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    acl ansible_host hdr(host) -i ansible.lumigame.com
    use_backend ansible_nodes if ansible_host

    # L1
    use_backend l1_game_client_nodes if { hdr(host) -i games.lumigame.com }
    use_backend l1_game_client1_nodes if { hdr(host) -i l1-games1.lumigame.com }
    use_backend l1_oldgame_client_nodes if { hdr(host) -i oldgames.lumigame.com }

    use_backend l1_api_nodes if { hdr(host) -i api.lumigame.com }
    use_backend l1_api1_nodes if { hdr(host) -i l1-api1.lumigame.com }

    use_backend l1_auth_api_nodes if { hdr(host) -i auth.lumigame.com }
    use_backend l1_auth_api1_nodes if { hdr(host) -i l1-auth1.lumigame.com }

    use_backend l1_game_admin_site_nodes if {  hdr(host) -i admin.lumigame.com }
    use_backend l1_game_admin_site1_nodes if {  hdr(host) -i l1-admin1.lumigame.com }

    use_backend l1_game_admin_api_nodes if { hdr(host) -i admin-api.lumigame.com }
    use_backend l1_game_admin_api1_nodes if { hdr(host) -i l1-admin-api1.lumigame.com }

    use_backend l1_gamelobby_simulator_nodes if { hdr(host) -i gamelobby-simulator.lumigame.com }
    use_backend l1_gamelobby_simulator1_nodes if { hdr(host) -i l1-glbs1.lumigame.com }

    use_backend l1_owapi_simulator_nodes if { hdr(host) -i owapi-simulator.lumigame.com }
    use_backend l1_owapi_simulator1_nodes if { hdr(host) -i l1-ows1.lumigame.com }

    use_backend l1_game_round_result_nodes if { hdr(host) -i result.lumigame.com }
    use_backend l1_game_round_result1_nodes if { hdr(host) -i l1-result1.lumigame.com }

    # L2
    acl l2_game_client_host hdr(host) -i l2-games.lumigame.com
    use_backend l2_game_client_nodes if l2_game_client_host

    acl l2_api_host hdr(host) -i l2-api.lumigame.com
    use_backend l2_api_nodes if l2_api_host

    acl l2_auth_api_host hdr(host) -i l2-auth.lumigame.com
    use_backend l2_auth_api_nodes if l2_auth_api_host

    acl l2_game_admin_site_host hdr(host) -i l2-admin.lumigame.com
    use_backend l2_game_admin_site_nodes if l2_game_admin_site_host

    acl l2_game_admin_api_host hdr(host) -i l2-admin-api.lumigame.com
    use_backend l2_game_admin_api_nodes if l2_game_admin_api_host

    acl l2_gamelobby_simulator_host hdr(host) -i l2-glbs.lumigame.com
    use_backend l2_gamelobby_simulator_nodes if l2_gamelobby_simulator_host

    acl l2_owapi_simulator_host hdr(host) -i l2-ows.lumigame.com
    use_backend l2_owapi_simulator_nodes if l2_owapi_simulator_host

    acl l2_game_round_result_host hdr(host) -i l2-result.lumigame.com
    use_backend l2_game_round_result_nodes if l2_game_round_result_host

    acl l2_game_news_host hdr(host) -i l2-news.lumigame.com
    use_backend l2_game_news_nodes if l2_game_news_host

    # tools 
    use_backend portainer_nodes if { hdr(host) -i portainer.lumigame.com }
    use_backend sonarqube_nodes if { hdr(host) -i sonarqube.lumigame.com }
    use_backend verdacio_nodes if { hdr(host) -i npm.lumigame.com }