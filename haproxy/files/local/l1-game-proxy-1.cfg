
frontend l1_games_proxy_1
    bind *:7002
    mode  http
    option forwardfor
    use_backend l1_game_server1_nodes if { path_beg /main/ }
    use_backend l1_sedie1_nodes if { path_beg /sedie/ }
    use_backend l1_vip_sedie1_nodes if { path_beg /vipsedie/ }
    use_backend l1_special_sedie1_nodes if { path_beg /specialsedie/ }
    use_backend l1_blackjack1_nodes if { path_beg /blackjack/ }
    use_backend l1_vip_fishprawncrab1_nodes if { path_beg /vipfishprawncrab/ }
    use_backend l1_sicbo1_nodes if { path_beg /sicbo/ }
    use_backend l1_vip_baccarat1_nodes if { path_beg /vipbaccarat/ }
    # use_backend l1_vip_sedie_war1_nodes if { path_beg /vipsediewar/ }
    default_backend l1_game_server1_nodes

backend l1_game_server1_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /main/(.*) /\1
    server-template l1_game_server 1 l1-game-server-LOCAL-1:5000 check resolvers docker init-addr libc,none

