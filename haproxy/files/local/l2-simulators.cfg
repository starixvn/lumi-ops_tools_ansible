
backend l2_gamelobby_simulator_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_gamelobby_simulator 1 l2-gamelobby-simulator-LOCAL:9106 check resolvers docker init-addr libc,none

backend l2_owapi_simulator_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /healthcheck
    http-check expect status 200
    cookie serverid insert
    server-template l2_owapi_simulator 1 l2-ow-api-simulator-LOCAL:9105 check resolvers docker init-addr libc,none
    