frontend l1_games_gateway
    bind *:8888
    mode  http
    option forwardfor
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock
    use_backend l1_gameserver_nodes if { path_beg /main/ }
    use_backend l1_sedie_nodes if { path_beg /sedie/ }
    use_backend l1_vipsedie_nodes if { path_beg /vipsedie/ }
    use_backend l1_special_sedie_nodes if { path_beg /specialsedie/ }
    use_backend l1_blackjack_nodes if { path_beg /blackjack/ }
    use_backend l1_vip_fishprawncrab_nodes if { path_beg /vipfishprawncrab/ }
    default_backend l1_gameserver_nodes

backend l1_gameserver_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /main/(.*) /\1
    server-template l1_game_server 1 l1-game-server-PROD:8200 check resolvers docker init-addr libc,none

