
frontend l2_game_round_result
    bind *:8315
    mode  http
    option forwardfor
    default_backend l2_game_round_result_nodes

backend l2_game_round_result_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l2-game-round-result 1 l2-game-round-result-PROD:8315 check resolvers docker init-addr libc,none
