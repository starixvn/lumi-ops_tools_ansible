
frontend l1_api
    bind *:8300
    mode  http
    option forwardfor
    default_backend l1_api_nodes

backend l1_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_api 2 l1-api-PROD:8300 check resolvers docker init-addr libc,none