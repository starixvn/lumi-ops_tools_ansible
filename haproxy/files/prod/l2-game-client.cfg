
frontend l2_game_client
    bind *:8110
    mode  http
    option forwardfor
    default_backend l2_game_client_nodes

backend l2_game_client_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_client 2 l2-game-client-PROD:80 check resolvers docker init-addr libc,none