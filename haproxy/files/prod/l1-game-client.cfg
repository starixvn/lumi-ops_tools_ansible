
frontend l1_game_client
    bind *:8100
    mode  http
    option forwardfor
    default_backend l1_game_client_nodes

backend l1_game_client_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_client 2 l1-game-client-PROD:80 check resolvers docker init-addr libc,none