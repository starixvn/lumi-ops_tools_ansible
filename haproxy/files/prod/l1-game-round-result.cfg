
frontend l1_game_round_result
    bind *:8305
    mode  http
    option forwardfor
    default_backend l1_game_round_result_nodes

backend l1_game_round_result_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l1-game-round-result 1 l1-game-round-result-PROD:8305 check resolvers docker init-addr libc,none
