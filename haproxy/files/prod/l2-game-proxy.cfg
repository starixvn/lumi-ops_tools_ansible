frontend l2_games_gateway
    bind *:8889
    mode  http
    option forwardfor
    #use_backend l1_gameserver_nodes if { path_beg /main/ }
    #use_backend l1_sedie_nodes if { path_beg /sedie/ }
    use_backend l2_vip_sedie_nodes if { path_beg /vipsedie/ }
    use_backend l2_special_sedie_nodes if { path_beg /specialsedie/ }
    #use_backend l1_blackjack_nodes if { path_beg /blackjack/ }
    default_backend l2_vipsedie_nodes

backend l2_vip_sedie_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /vipsedie/(.*) /\1
    server-template l2_vip_sedie 1 l2-vip-sedie-service-PROD:8501 check resolvers docker init-addr libc,none

backend l2_special_sedie_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /specialsedie/(.*) /\1
    server-template l2_special_sedie 1 l2-special-sedie-service-PROD:8502 check resolvers docker init-addr libc,none