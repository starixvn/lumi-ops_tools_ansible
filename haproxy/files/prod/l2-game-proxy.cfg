frontend l2_games_gateway
    bind *:8889
    mode  http
    option forwardfor
    use_backend l2_gameserver_nodes if { path_beg /main/ }
    use_backend l2_sedie_nodes if { path_beg /sedie/ }
    use_backend l2_vip_sedie_nodes if { path_beg /vipsedie/ }
    use_backend l2_special_sedie_nodes if { path_beg /specialsedie/ }
    default_backend l2_gameserver_nodes


backend l2_gameserver_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /main/(.*) /\1
    server-template l2_game_server 1 l2-game-server-PROD:8210 check resolvers docker init-addr libc,none
    
backend l2_sedie_nodes
    option forwardfor
    option http-server-close
