
frontend l2_api
    bind *:8310
    mode  http
    option forwardfor
    default_backend l2_api_nodes

backend l2_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_api 2 l2-api-PROD:8310 check resolvers docker init-addr libc,none