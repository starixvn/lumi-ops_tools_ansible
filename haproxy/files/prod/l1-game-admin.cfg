
frontend l1_game_admin_site
    bind *:8301
    mode  http
    option forwardfor
    acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    http-request deny if !is-whitelisted-ip
    default_backend l1_game_admin_site_nodes

backend l1_game_admin_site_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_admin_site 1 l1-game-admin-site-PROD:8301 check resolvers docker init-addr libc,none

frontend l1_game_admin_api
    bind *:8304
    mode  http
    option forwardfor
    default_backend l1_game_admin_api_nodes

backend l1_game_admin_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_admin_api 1 l1-game-admin-api-PROD:8304 check resolvers docker init-addr libc,none