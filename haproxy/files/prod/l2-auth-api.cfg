
frontend l2_auth_api
    bind *:8313
    mode  http
    option forwardfor
    default_backend l2_auth_api_nodes

backend l2_auth_api_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_auth_api 1 l2-auth-api-PROD:8313 check resolvers docker init-addr libc,none