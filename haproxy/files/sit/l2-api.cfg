
frontend l2_api_sit
    bind *:6310
    mode  http
    option forwardfor
    default_backend l2_api_nodes_sit

backend l2_api_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_api_SIT 2 l2-api-SIT:6310 check resolvers docker init-addr libc,none