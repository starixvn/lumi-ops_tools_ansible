

frontend l1_game_round_result_sit
    bind *:6305
    mode  http
    option forwardfor
    default_backend l1_game_round_result_nodes_sit

backend l1_game_round_result_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l1-game-round-result_SIT 1 l1-game-round-result-SIT:6305 check resolvers docker init-addr libc,none

frontend l1_game_round_result_uat
    bind *:7305
    mode  http
    option forwardfor
    default_backend l1_game_round_result_nodes_uat

backend l1_game_round_result_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l1-game-round-result_UAT 1 l1-game-round-result-UAT:7305 check resolvers docker init-addr libc,none