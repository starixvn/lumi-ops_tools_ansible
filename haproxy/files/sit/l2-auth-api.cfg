
frontend l2_auth_api_sit
    bind *:6313
    mode  http
    option forwardfor
    default_backend l2_auth_api_nodes_sit

backend l2_auth_api_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_auth_api_SIT 1 l2-auth-api-SIT:6313 check resolvers docker init-addr libc,none

frontend l2_auth_api_uat
    bind *:7313
    mode  http
    option forwardfor
    default_backend l2_auth_api_nodes_uat

backend l2_auth_api_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_auth_api_UAT 1 l2-auth-api-UAT:7313 check resolvers docker init-addr libc,none