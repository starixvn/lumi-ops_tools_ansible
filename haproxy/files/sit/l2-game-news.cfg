

frontend l2_game_news_sit
    bind *:6316
    mode  http
    option forwardfor
    default_backend l2_game_news_nodes_sit

backend l2_game_news_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_news_SIT 2 l2-game-news-SIT:6316 check resolvers docker init-addr libc,none

