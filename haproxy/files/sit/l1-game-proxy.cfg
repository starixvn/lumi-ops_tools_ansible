
frontend l1_games_proxy
    bind *:7777
    mode  http
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats show-node
    stats auth lumi:lum!onRock

    use_backend l1_game_server_nodes_sit if { path_beg /sit/main/ }
    use_backend l1_sedie_nodes_sit if { path_beg /sit/sedie/ }
    use_backend l1_vip_sedie_nodes_sit if { path_beg /sit/vipsedie/ }
    use_backend l1_special_sedie_nodes_sit if { path_beg /sit/specialsedie/ }
    use_backend l1_blackjack_nodes_sit if { path_beg /sit/blackjack/ }
    use_backend l1_vip_fishprawncrab_nodes_sit if { path_beg /sit/vipfishprawncrab/ }
    use_backend l1_vip_fishprawncrab_nodes_uat if { path_beg /uat/vipfishprawncrab/ }
    use_backend l1_sicbo_nodes_sit if { path_beg /sit/sicbo/ }
    use_backend l1_sicbo_nodes_uat if { path_beg /uat/sicbo/ }

    use_backend l1_game_server_nodes_uat if { path_beg /uat/main/ }
    use_backend l1_sedie_nodes_uat if { path_beg /uat/sedie/ }
    use_backend l1_vip_sedie_nodes_uat if { path_beg /uat/vipsedie/ }
    use_backend l1_special_sedie_nodes_uat if { path_beg /uat/specialsedie/ }
    use_backend l1_blackjack_nodes_uat if { path_beg /uat/blackjack/ }

    use_backend l2_game_server_nodes_sit if { path_beg /sit/main/ }

    default_backend l1_game_server_nodes_sit

backend l1_game_server_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    http-request replace-path /sit/main/(.*) /\1
    server-template l1_game_server_SIT 1 l1-game-server-SIT:6200 check resolvers docker init-addr libc,none

