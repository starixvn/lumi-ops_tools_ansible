
frontend l1_gamelobby_simulator
    bind *:6400
    mode  http
    option forwardfor
    default_backend l1_gamelobby_simulator_nodes

backend l1_gamelobby_simulator_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_gamelobby_simulator 1 l1-gamelobby-simulator-SIT:6400 check resolvers docker init-addr libc,none

frontend l1_owapi_simulator
    bind *:6401
    mode  http
    option forwardfor
    default_backend l1_owapi_simulator_nodes

backend l1_owapi_simulator_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /healthcheck
    http-check expect status 200
    cookie serverid insert
    server-template l1_owapi_simulator 1 l1-ow-api-simulator-SIT:6401 check resolvers docker init-addr libc,none
