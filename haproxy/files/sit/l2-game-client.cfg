
frontend l2_game_client_sit
    bind *:6110
    mode  http
    option forwardfor
    default_backend l2_game_client_nodes_sit

backend l2_game_client_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_client_SIT 2 l2-game-client-SIT:80 check resolvers docker init-addr libc,none
    