
frontend l1_api_sit
    bind *:6300
    mode  http
    option forwardfor
    default_backend l1_api_nodes_sit

backend l1_api_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_api_SIT 2 l1-api-SIT:6300 check resolvers docker init-addr libc,none

frontend l1_api_uat
    bind *:7300
    mode  http
    option forwardfor
    default_backend l1_api_nodes_uat

backend l1_api_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_api_UAT 2 l1-api-UAT:7300 check resolvers docker init-addr libc,none