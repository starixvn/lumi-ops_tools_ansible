
frontend l2_gamelobby_simulator
    bind *:6410
    mode  http
    option forwardfor
    default_backend l2_gamelobby_simulator_nodes

backend l2_gamelobby_simulator_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l2_gamelobby_simulator 1 l2-gamelobby-simulator-SIT:6410 check resolvers docker init-addr libc,none

frontend l2_owapi_simulator
    bind *:6411
    mode  http
    option forwardfor
    default_backend l2_owapi_simulator_nodes

backend l2_owapi_simulator_nodes
    option forwardfor
    option http-server-close
    option httpchk HEAD /healthcheck
    http-check expect status 200
    cookie serverid insert
    server-template l2_owapi_simulator 1 l2-ow-api-simulator-SIT:6411 check resolvers docker init-addr libc,none
