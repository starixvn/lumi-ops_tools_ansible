
frontend l2_game_admin_site_sit
    bind *:6311
    mode  http
    option forwardfor
    acl is-whitelisted-ip src -f /etc/haproxy/whitelisted.ips
    http-request deny if !is-whitelisted-ip
    default_backend l2_game_admin_site_nodes_sit

backend l2_game_admin_site_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l2_game_admin_site_SIT 1 l2-game-admin-site-SIT:6311 check resolvers docker init-addr libc,none

