
frontend l1_auth_api_sit
    bind *:6303
    mode  http
    option forwardfor
    default_backend l1_auth_api_nodes_sit

backend l1_auth_api_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_auth_api_SIT 1 l1-auth-api-SIT:6303 check resolvers docker init-addr libc,none

frontend l1_auth_api_uat
    bind *:7303
    mode  http
    option forwardfor
    default_backend l1_auth_api_nodes_uat

backend l1_auth_api_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_auth_api_UAT 1 l1-auth-api-UAT:7303 check resolvers docker init-addr libc,none