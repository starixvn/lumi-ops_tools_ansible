
frontend l1_game_client_sit
    bind *:6100
    mode  http
    option forwardfor
    default_backend l1_game_client_nodes_sit

backend l1_game_client_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_client_SIT 2 l1-game-client-SIT:80 check resolvers docker init-addr libc,none

frontend l1_game_client_uat
    bind *:7100
    mode  http
    option forwardfor
    default_backend l1_game_client_nodes_uat

backend l1_game_client_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template l1_game_client_UAT 2 l1-game-client-UAT:80 check resolvers docker init-addr libc,none
    