

frontend l2_game_round_result_sit
    bind *:6315
    mode  http
    option forwardfor
    default_backend l2_game_round_result_nodes_sit

backend l2_game_round_result_nodes_sit
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l2-game-round-result_SIT 1 l2-game-round-result-SIT:6315 check resolvers docker init-addr libc,none

frontend l2_game_round_result_uat
    bind *:7315
    mode  http
    option forwardfor
    default_backend l2_game_round_result_nodes_uat

backend l2_game_round_result_nodes_uat
    option forwardfor
    option http-server-close
    option httpchk HEAD /health
    http-check expect status 200
    cookie serverid insert
    server-template l2-game-round-result_UAT 1 l2-game-round-result-UAT:7315 check resolvers docker init-addr libc,none